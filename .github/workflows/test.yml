name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - name: bot baseline (seed 1 -> 1640)
        run: go run ./scripts/run_bot -seed 1 | grep -q 'balance=1640.*done=true'
